[include utilities/ENABLE_HEATER.cfg]
[include utilities/WAIT_FOR_HEATER.cfg]
[include utilities/TRY_RETRACT.cfg]
[include utilities/TRY_UNRETRACT.cfg]

[gcode_macro _START_PRINT]
description: Sequence of gcode commands for starting a print.
variable_bed_profile: ""
variable_bed_temp: 0
variable_extruder_temp: 0
variable_bed_temp_error: 0
variable_extruder_temp_error: 0
gcode:
   # Parameters
   {% set BED_PROFILE         = params.BED_PROFILE|default("default")|string %}
   {% set BED_TEMP            = params.BED_TEMP|default(0)|float             %}
   {% set EXTRUDER_TEMP       = params.EXTRUDER_TEMP|float                   %}
   {% set BED_TEMP_ERROR      = params.BED_TEMP_ERROR|default(5)|float       %}
   {% set EXTRUDER_TEMP_ERROR = params.EXTRUDER_TEMP_ERROR|default(10)|float %}

   # Clear pause state
   CLEAR_PAUSE

   # Update variables
   SET_VARIABLE MACRO=_START_PRINT VARIABLE=bed_profile         VALUE={BED_PROFILE}
   SET_VARIABLE MACRO=_START_PRINT VARIABLE=bed_temp            VALUE={BED_TEMP}
   SET_VARIABLE MACRO=_START_PRINT VARIABLE=extruder_temp       VALUE={EXTRUDER_TEMP}
   SET_VARIABLE MACRO=_START_PRINT VARIABLE=bed_temp_error      VALUE={BED_TEMP_ERROR}
   SET_VARIABLE MACRO=_START_PRINT VARIABLE=extruder_temp_error VALUE={EXTRUDER_TEMP_ERROR}

   {% if BED_TEMP > 0 %} RESPOND MSG={"Heating bed to " + BED_TEMP|string + "C"}
   {% else            %} RESPOND MSG="Heat bed disabled."
   {% endif           %}

   RESPOND MSG={"Heating extruder to " + EXTRUDER_TEMP|string + "C"}

   # Heating
   ENABLE_HEATER   HEATER=heater_bed TARGET={BED_TEMP}
   ENABLE_HEATER   HEATER=extruder   TARGET={EXTRUDER_TEMP}
   WAIT_FOR_HEATER HEATER=heater_bed TARGET={BED_TEMP}      TARGET_ERROR={BED_TEMP_ERROR}
   WAIT_FOR_HEATER HEATER=extruder   TARGET={EXTRUDER_TEMP} TARGET_ERROR={EXTRUDER_TEMP_ERROR}

   RESPOND MSG={"Loaded bed mesh profile \"" + BED_PROFILE + "\""}

   # Clear any enabled bed mesh profile
   BED_MESH_CLEAR

   # Load bed mesh profile
   BED_MESH_PROFILE LOAD={BED_PROFILE}

   # Reset the G-Code Z offset
   SET_GCODE_OFFSET Z=0

   # Use absolute coordinates
   G90

   # Home the printer
   G28
   
   # Unretract
   TRY_UNRETRACT

   # Purge nozzle
   G1 X10   Y10    Z0.28 F6000
   G1 X10   Y200.0 Z0.28 F1500 E15
   G1 X10.3 Y200.0 Z0.28 F6000
   G1 X10.3 Y10    Z0.28 F1500 E15

   # Retract
   TRY_RETRACT

   # Move up 5mm for clearance
   G1 Z5 F5000