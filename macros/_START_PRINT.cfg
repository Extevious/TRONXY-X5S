[include utilities/ENABLE_HEATER.cfg]
[include utilities/WAIT_FOR_HEATER.cfg]
[include utilities/TRY_RETRACT.cfg]
[include utilities/TRY_UNRETRACT.cfg]
[include utilities/_PURGE_LINE.cfg]
[include utilities/_RESPOND_COMMON.cfg]
[include utilities/_SELECTIVE_HOMING.cfg]

[gcode_macro _START_PRINT]
description: Sequence of gcode commands for starting a print.
gcode:
   # Parameters
   {% set BED_PROFILE         = params.BED_PROFILE|default('default')|string %}
   {% set BED_TEMP            = params.BED_TEMP|default(0)|float             %}
   {% set EXTRUDER_TEMP       = params.EXTRUDER_TEMP|float                   %}
   {% set BED_TEMP_ERROR      = params.BED_TEMP_ERROR|default(5)|float       %}
   {% set EXTRUDER_TEMP_ERROR = params.EXTRUDER_TEMP_ERROR|default(10)|float %}

   # Clear pause state
   CLEAR_PAUSE

   # Store variables
   SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_profile         VALUE='{BED_PROFILE}'
   SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_temp            VALUE={BED_TEMP}
   SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_temp       VALUE={EXTRUDER_TEMP}
   SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_temp_error      VALUE={BED_TEMP_ERROR}
   SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_temp_error VALUE={EXTRUDER_TEMP_ERROR}

   # Clear any enabled bed mesh profile
   BED_MESH_CLEAR

   # Load bed mesh profile
   BED_MESH_PROFILE LOAD={BED_PROFILE}

   # Echo loaded bed mesh profile status
   _RESPOND_COMMON TYPE=loaded_bed_mesh PROFILE={BED_PROFILE}

   # Echo bed heating status
   {% if BED_TEMP > 0 %} _RESPOND_COMMON TYPE=heating_bed TEMP={BED_TEMP}
   {% else            %} _RESPOND_COMMON TYPE=heating_bed_disabled
   {% endif %}

   # Echo extruder heating status
   _RESPOND_COMMON TYPE=heating_extruder TEMP={EXTRUDER_TEMP}

   # Heating
   ENABLE_HEATER   HEATER=heater_bed TARGET={BED_TEMP}
   ENABLE_HEATER   HEATER=extruder   TARGET={EXTRUDER_TEMP}
   WAIT_FOR_HEATER HEATER=heater_bed TARGET={BED_TEMP}      TARGET_ERROR={BED_TEMP_ERROR}
   WAIT_FOR_HEATER HEATER=extruder   TARGET={EXTRUDER_TEMP} TARGET_ERROR={EXTRUDER_TEMP_ERROR}

   _RESPOND_COMMON TYPE=heating_finished

   # Use absolute coordinates
   G90

   # Home the printer
   _SELECTIVE_HOMING Z_ALWAYS=True
   
   # Purge line
   _PURGE_LINE
   
   # Reset extruder
   G92 E0

   # Move up 5mm for clearance
   G1 Z5 F5000

   _RESPOND_COMMON TYPE=print_started