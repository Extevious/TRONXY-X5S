[gcode_macro _PARK_TOOLHEAD]
description: Parks the print head to a safe location.
gcode:
   {% set edge_offset = params.EDGE_OFFSET|default(10)|float          %}
   {% set x_position  = printer.toolhead.axis_minimum.x + edge_offset %}
   {% set y_position  = printer.toolhead.axis_maximum.y - edge_offset %}

   # State validation
   {% if printer.toolhead.homed_axes != "xyz" %} _RESPOND_COMMON TAG="Parking toolhead failed: " TYPE=not_homed

   {% else %}

      RESPOND TYPE=echo MSG='{"Parking toolhead at position X" + x_position|string + " Y" + y_position|string}'

      # Save gcode state
      SAVE_GCODE_STATE NAME=park_toolhead_state

      # Use absolute coordinates
      G90

      # Move to absolute park position
      G1 X{x_position} Y{y_position} F6000.0

      # Restore gcode state
      RESTORE_GCODE_STATE NAME=park_toolhead_state

   {% endif %}
