[include utilities/TRY_UNRETRACT.cfg]

[gcode_macro RESUME]
description: Resumes the current running print.
rename_existing: RESUME_BASE
gcode:
   # State validation
   {% if   printer.print_stats.state|lower == "standby"   %} RESPOND TYPE=error MSG="Printer is idle."
   {% elif printer.print_stats.state|lower == "cancelled" %} RESPOND TYPE=error MSG="Cannot resume a cancelled print."
   {% elif printer.print_stats.state|lower == "printing"  %} RESPOND TYPE=echo  MSG="Print already running."

   {% else %}

      # Load saved variables from _START_PRINT
      {% set BED_PROFILE         = printer['gcode _START_PRINT'].bed_profile|string        %}
      {% set BED_TEMP            = printer['gcode _START_PRINT'].bed_temp|float            %}
      {% set EXTRUDER_TEMP       = printer['gcode _START_PRINT'].extruder_temp|float       %}
      {% set BED_TEMP_ERROR      = printer['gcode _START_PRINT'].bed_temp_error|float      %}
      {% set EXTRUDER_TEMP_ERROR = printer['gcode _START_PRINT'].extruder_temp_error|float %}

      BED_MESH_PROFILE LOAD={BED_PROFILE}

      ENABLE_HEATER   HEATER=heater_bed TARGET={BED_TEMP}
      ENABLE_HEATER   HEATER=extruder   TARGET={EXTRUDER_TEMP}
      WAIT_FOR_HEATER HEATER=heater_bed TARGET={BED_TEMP}      TARGET_ERROR={BED_TEMP_ERROR}
      WAIT_FOR_HEATER HEATER=extruder   TARGET={EXTRUDER_TEMP} TARGET_ERROR={EXTRUDER_TEMP_ERROR}

      RESUME_BASE

      TRY_UNRETRACT
      
  {% endif %}
