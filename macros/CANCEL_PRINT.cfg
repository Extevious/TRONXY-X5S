[include utilities/SAFE_MOVE_TOOLHEAD_UP.cfg]
[include utilities/_PARK_TOOLHEAD.cfg]
[include utilities/CLAMPED_MOVE.cfg]
[include utilities/TRY_RETRACT.cfg]

[gcode_macro CANCEL_PRINT]
description: Sequence of gcode commands for canceling a print.
rename_existing: CANCEL_PRINT_BASE
gcode:
   # Retract
   TRY_RETRACT

   # Turn off all heaters
   TURN_OFF_HEATERS

   # Turn off fans
   M117

   # Move the toolhead up to avoid collisions
   SAFE_MOVE_TOOLHEAD_UP

   # Park toolhead
   _PARK_TOOLHEAD

   # Cancel print base
   CANCEL_PRINT_BASE
    
   # Disable steppers
   M84
