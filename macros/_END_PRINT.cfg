[include utilities/SAFE_MOVE_TOOLHEAD_UP.cfg]
[include utilities/_PARK_TOOLHEAD.cfg]
[include utilities/CLAMPED_MOVE.cfg]
[include utilities/TRY_RETRACT.cfg]

[gcode_macro _END_PRINT]
description: Sequence of gcode commands for ending a print.
gcode:
   # Retract
   TRY_RETRACT

   # Turn off all heaters
   TURN_OFF_HEATERS

   # Turn off fans
   M107

   # Only move the toolhead if print isn't paused (avoids duplicate moves)
   {% if printer.print_stats.state|lower != "paused" %}

      # Move the toolhead up to avoid collisions
      SAFE_MOVE_TOOLHEAD_UP AMOUNT=50

      # Park the toolhead
      _PARK_TOOLHEAD

   {% endif %}

   # Disable steppers
   M84
   
   _RESPOND_COMMON TYPE=print_finished