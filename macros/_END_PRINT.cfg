[include utilities/_PARK_TOOLHEAD.cfg]
[include utilities/CLAMPED_MOVE.cfg]

[gcode_macro _END_PRINT]
description: Sequence of gcode commands for ending a print.
gcode:
   # Retract
   G10

   # Turn off all heaters
   TURN_OFF_HEATERS

   # Turn off fans
   M117

   # Move the toolhead up to avoid collisions
   SAFE_MOVE_TOOLHEAD_UP

   # Park the toolhead
   _PARK_TOOLHEAD

   # Disable steppers
   M84